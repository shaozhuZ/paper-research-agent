# One-command local stack: Milvus (etcd + minio + standalone) and the four app services.
#   cp .env.example .env   # add GOOGLE_API_KEY
#   docker compose up -d --build --wait   # --wait returns once every service is healthy
# UI: http://localhost:8080   API: http://localhost:8000/docs   Milvus: localhost:19530

x-app-env: &app-env
  env_file: .env

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  translation-service:
    build: ./translation-service
    ports:
      - "7000:7000"

  mcp-server:
    <<: *app-env
    build: ./mcp-server
    environment:
      MILVUS_URI: http://milvus:19530
      TRANSLATION_SERVICE_URL: http://translation-service:7000
      UPLOAD_DIR: /data/uploads
      MILVUS_COLLECTION: research_papers_v2
      # dense | bm25 | hybrid, for the agent's vector_search tool
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-dense}
      RETRIEVAL_RERANK: ${RETRIEVAL_RERANK:-false}
      RERANK_MODEL: ${RERANK_MODEL:-rerank-3}
    volumes:
      - uploads:/data/uploads:ro
    ports:
      - "9000:9000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      milvus:
        condition: service_healthy
      translation-service:
        condition: service_started

  mcp-host:
    <<: *app-env
    build: ./mcp-host
    environment:
      MCP_TOOL_URL: http://mcp-server:9000/mcp
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT:-25}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    restart: on-failure
    # healthy only once the agent has an MCP session (the same check as GET /ok)
    healthcheck:
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/ok', timeout=3)).get('mcp') else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      mcp-server:
        condition: service_healthy

  streamlit:
    build: ./streamlit
    environment:
      LANGGRAPH_API_BASE: http://mcp-host:8000
    ports:
      - "8080:8080"
    depends_on:
      mcp-host:
        condition: service_healthy

volumes:
  uploads:
  etcd_data:
  minio_data:
  milvus_data:
